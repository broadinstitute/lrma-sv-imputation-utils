# Pin the toolchain so local builds, CI, and the Docker image all use the same
# rustc. 1.90.0 is the toolchain the original builds used.
#
# The hard floor is 1.86 regardless: pop-glimpse2 is `edition = "2024"` (needs
# rustc >= 1.85) and the extract/paste locks pin icu 2.2.0 (needs rustc >= 1.86,
# pulled in via rust-htslib -> url -> idna's default ICU4X back end). Any stable
# >= 1.90 will reproduce these builds; bump deliberately. `rustup` fetches this
# version automatically.
[toolchain]
channel = "1.90.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
