# Virtual workspace that ties the three helper crates together so they share a
# single, committed Cargo.lock (the reproducibility guarantee) and build HTSlib
# once instead of three times.
#
# MERGE NOTE: if the repository root already has a Cargo.toml, merge these
# `members` into it rather than overwriting. The members below are listed
# explicitly (not globbed) so no other Rust crate under resources/ is pulled in.
[workspace]
resolver = "2"
members = [
    "resources/extract-bubble-PLs",
    "resources/pop-glimpse2",
    "resources/paste-vcfs",
]

# Shared release profile for all three binaries. Individual crate manifests may
# also set this; workspace-level settings win for the final artifacts.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
