name: docker-image

# Builds the final tools image and runs the exact-match suite INSIDE it, so we
# verify the shipped binaries (not just a native build) pass. Tests are
# bind-mounted at run time and never baked into the image.
#
# The base image (docker/lrma-aou2-panel-creation-rust/Dockerfile) compiles
# bcftools from source, which is slow; this workflow runs on demand / on release
# branches rather than on every PR. If a prebuilt base image is available in a
# registry, replace the "Build base image" step with a `docker pull` and set
# BASE_IMAGE to it.
#
# NOTE: we use plain `docker build` (the default BuildKit builder that shares the
# host daemon's image store) rather than docker/build-push-action. That action
# runs in an isolated buildx "docker-container" builder whose image store the
# host can't see, so the app image's `FROM ${BASE_IMAGE}` would try to pull the
# just-built base from a registry and fail with "pull access denied". Plain
# `docker build` keeps the base image local and visible to the app build.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "resources/**"
      - "docker/**"
      - "rust-toolchain.toml"
      - ".github/workflows/docker-image.yml"

env:
  BASE_IMAGE: lrma-aou2-panel-creation-rust:ci
  APP_IMAGE: lrma-sv-imputation-utils:ci
  DOCKER_BUILDKIT: "1"

jobs:
  build-and-test-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Require committed lockfiles
        run: |
          missing=0
          for c in extract-bubble-PLs pop-glimpse2 paste-vcfs; do
            if [ ! -f "resources/$c/Cargo.lock" ]; then
              echo "::error::resources/$c/Cargo.lock is missing (see README)."
              missing=1
            fi
          done
          [ "$missing" = 0 ]

      # Build the base toolchain/bcftools image into the host daemon.
      # Replace with `docker pull <registry>/<base>` if you publish the base.
      - name: Build base image (bcftools + rust)
        run: |
          docker build \
            -f docker/lrma-aou2-panel-creation-rust/Dockerfile \
            -t "$BASE_IMAGE" .

      # Build the app image FROM the local base (visible because we use the
      # default builder, not an isolated buildx container).
      - name: Build app image (release binaries)
        run: |
          docker build \
            -f docker/app/Dockerfile \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            -t "$APP_IMAGE" .

      # Run the suite inside the final image against /usr/local/bin, with the
      # tests bind-mounted read-only (never part of the image).
      - name: Run exact-match suite inside the image
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/resources/tests:/tests:ro" \
            "$APP_IMAGE" \
            bash /tests/run_all.sh --bin-dir /usr/local/bin
